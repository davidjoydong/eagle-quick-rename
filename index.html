<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>eagle-quick-rename</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero__icon" aria-hidden="true">
          <span>001</span>
        </div>
        <div>
          <p class="eyebrow">EAGLE QUICK RENAME</p>
          <h1>eagle-quick-rename</h1>
          <p class="hero__description">为选中条目追加编号，或使用统一名称重新编号。</p>
        </div>
      </header>

      <section class="settings-card" aria-labelledby="settings-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">格式</p>
            <h2 id="settings-title">编号设置</h2>
          </div>
          <button class="icon-button" id="refresh-button" type="button" title="刷新当前选择" aria-label="刷新当前选择">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8.1 8.1 0 0 0-14.9-3M4 4v4h4M4 13a8.1 8.1 0 0 0 14.9 3M20 20v-4h-4" />
            </svg>
          </button>
        </div>

        <div class="settings-grid">
          <label class="field field--wide">
            <span>统一名称（可选）</span>
            <input
              id="base-name"
              type="text"
              maxlength="180"
              placeholder="留空则保留原始名称；输入后将忽略原名称"
              autocomplete="off"
            />
          </label>

          <label class="field">
            <span>起始编号</span>
            <input id="start-number" type="number" value="1" min="0" max="99999999" inputmode="numeric" />
          </label>

          <label class="field">
            <span>编号位数</span>
            <input id="digit-count" type="number" value="3" min="1" max="8" inputmode="numeric" />
          </label>

          <label class="field field--wide">
            <span>名称与编号之间</span>
            <select id="separator">
              <option value="">不加分隔符（示例：图片001）</option>
              <option value=" ">空格（示例：图片 001）</option>
              <option value="-">短横线（示例：图片-001）</option>
              <option value="_">下划线（示例：图片_001）</option>
            </select>
          </label>
        </div>
      </section>

      <section class="preview-card" aria-labelledby="preview-title">
        <div class="section-heading section-heading--preview">
          <div>
            <p class="section-kicker">预览</p>
            <h2 id="preview-title">重命名结果</h2>
          </div>
          <span class="selection-count" id="selection-count">读取中…</span>
        </div>

        <div class="empty-state" id="empty-state" hidden>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="8" y="10" width="32" height="28" rx="5" />
            <path d="M15 19h18M15 26h12M15 33h8" />
          </svg>
          <strong>还没有选中条目</strong>
          <span>回到 Eagle 选中一个或多个条目，再点击右上角刷新。</span>
        </div>

        <div class="loading-state" id="loading-state">
          <span class="spinner" aria-hidden="true"></span>
          <span>正在读取当前选择…</span>
        </div>

        <ol class="preview-list" id="preview-list" aria-live="polite"></ol>
        <p class="preview-overflow" id="preview-overflow" hidden></p>
      </section>

      <div class="status" id="status" role="status" aria-live="polite" hidden></div>

      <footer class="action-bar">
        <p class="order-note">编号顺序与 Eagle 返回的当前选择顺序一致。</p>
        <div class="action-buttons">
          <button class="secondary-button" id="rename-close-button" type="button" disabled>
            <span class="button-label">重命名并关闭</span>
          </button>
          <button class="primary-button" id="rename-button" type="button" disabled>
            <span class="button-label">确认重命名</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </footer>
    </main>

    <script src="js/rename.js"></script>
    <script src="js/plugin.js"></script>
  </body>
</html>
